[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jallekha-api"
version = "0.1.0"
description = "JalLekha FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "openpyxl==3.1.5",
  "shapely==2.1.2",
  "pydantic==2.11.3",
  "sqlalchemy==2.0.40",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
