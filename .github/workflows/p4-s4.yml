name: P4:S4

on:
  push:
    branches: [feat/s4-shells]
    paths:
      - "frontend/**"
      - "docs/features.csv"
      - "docs/BRANCH_WORKLOG.md"
      - ".github/workflows/p4-s4.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/features.csv"
      - "docs/BRANCH_WORKLOG.md"
      - ".github/workflows/p4-s4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s4-shells:
    name: s4-shells
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
