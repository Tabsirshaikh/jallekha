name: "P1:E3"
on:
  push:
    branches: [feat/e3-growth]
  pull_request:
    branches: [codex/e1-location-validation, feat/e4-equity, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth:
    name: "P1:E3"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e 'backend[dev,geo]'
      - run: python scripts/evidence/verify_crosswalk.py
      - run: python scripts/evidence/verify_evidence.py
      - run: python scripts/evidence/verify_growth.py
      - run: pytest backend/tests/test_e3_growth.py backend/tests/test_e2_evidence.py backend/tests/test_location_validation.py
      - run: ruff check --config backend/pyproject.toml scripts/evidence backend/tests/test_e3_growth.py backend/app/config/growth.py
      - run: ruff format --check --config backend/pyproject.toml scripts/evidence backend/tests/test_e3_growth.py backend/app/config/growth.py
