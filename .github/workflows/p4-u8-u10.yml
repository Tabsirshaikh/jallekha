name: P4:U8-U10

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/frontend/build_u9_snapshot.py"
      - "docs/features.csv"
      - "docs/BRANCH_WORKLOG.md"
      - "docs/P4_DEMO.md"
      - ".github/workflows/p4-u8-u10.yml"
  push:
    branches: [feat/u7-plan]
    paths:
      - "frontend/**"
      - "scripts/frontend/build_u9_snapshot.py"
      - "docs/features.csv"
      - "docs/BRANCH_WORKLOG.md"
      - "docs/P4_DEMO.md"
      - ".github/workflows/p4-u8-u10.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-resident-explanations-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm run lint --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
