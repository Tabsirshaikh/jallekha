name: "P3:T8"

# T8 shortage early warning (F6): risk list 1-3 months ahead from T2's forecast and A8's
# capacity, rule boundaries, groundwater unavailable, reservoirs off, committed list reproduces.
on:
  push:
    branches: [feat/t8-shortage]
  pull_request:
    branches: [main]
    paths:
      - "backend/app/services/shortage.py"
      - "backend/app/config/forecast.py"
      - "backend/app/config/sandbox.py"
      - "backend/tests/services/test_shortage.py"
      - "scripts/forecast/run_shortage.py"
      - "data/derived/forecast_table.csv"
      - "data/derived/shortage_risk.csv"
      - "data/derived/sandbox/section_points.csv"
      - "data/verification/sandbox_checks.json"
      - ".github/workflows/p3-t8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortage:
    name: "P3:T8"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e 'backend[dev,geo]'
      - name: Shortage risk tests (rules, capacity, reasons, done-when, committed list)
        run: pytest backend/tests/services/test_shortage.py
      - name: Lint T8 files
        run: >-
          ruff check --config backend/pyproject.toml
          backend/app/services/shortage.py backend/app/config/forecast.py
          backend/tests/services/test_shortage.py scripts/forecast/run_shortage.py
      - name: Format check T8 files
        run: >-
          ruff format --check --config backend/pyproject.toml
          backend/app/services/shortage.py backend/app/config/forecast.py
          backend/tests/services/test_shortage.py scripts/forecast/run_shortage.py
